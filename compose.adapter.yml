# Standalone backend; LiteLLM is on another LAN host. No gateway/admin UI here.
services:
  claude-proxy:
    build:
      context: .
      target: ${PROXY_BUILD_TARGET:-default}
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.322}
    environment:
      PORT: "3456"
      DATABASE_PATH: /app/data/proxy.db
      CLAUDE_INFERENCE_BACKEND: ${CLAUDE_INFERENCE_BACKEND:-cli}
      CLAUDE_CLI_RUNTIME_DIR: /tmp/claude-proxy-cli
      CLAUDE_CLI_SESSION_TTL_SECONDS: ${CLAUDE_CLI_SESSION_TTL_SECONDS:-3600}
      CLAUDE_CLI_MAX_SESSIONS: ${CLAUDE_CLI_MAX_SESSIONS:-8}
      UPSTREAM_AUTH_SOURCE: ${UPSTREAM_AUTH_SOURCE:-configured}
      CLAUDE_AUTH_AUTO_REFRESH: ${CLAUDE_AUTH_AUTO_REFRESH:-false}
      ADMIN_API_SECRET: ${ADMIN_API_SECRET:?Set a dedicated proxy admin secret}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Optional official setup-token input; the CLI backend performs inference.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-300000}
      RESPONSES_ENABLED: ${RESPONSES_ENABLED:-false}
      RESPONSES_STATE_KEY: ${RESPONSES_STATE_KEY:-}
      RESPONSES_STATE_TTL_SECONDS: ${RESPONSES_STATE_TTL_SECONDS:-604800}
      RESPONSES_MAX_OUTPUT_TOKENS: ${RESPONSES_MAX_OUTPUT_TOKENS:-8192}
      RESPONSES_THINKING_BUDGET_TOKENS: ${RESPONSES_THINKING_BUDGET_TOKENS:-1024}
      RESPONSES_APPLY_PATCH_MODE: ${RESPONSES_APPLY_PATCH_MODE:-reject}
      RESPONSES_DEVELOPER_MESSAGE_MODE: ${RESPONSES_DEVELOPER_MESSAGE_MODE:-reject}
      AUTH_DISABLED: "false"
      OLLAMA_URL: ${OLLAMA_URL:-http://127.0.0.1:11434}
    ports:
      - "${PROXY_BIND_IP:?Set the proxy host LAN IP}:${PROXY_PORT:-13456}:3456"
    volumes:
      - claude-proxy-data:/app/data
    tmpfs:
      - /tmp:size=256m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped

volumes:
  claude-proxy-data:
