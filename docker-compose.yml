services:
  app:
    build: .
    environment:
      - PORT=3456
      - DATABASE_PATH=/app/data/proxy.db
      - ADMIN_API_SECRET=${ADMIN_API_SECRET}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      - UPSTREAM_TIMEOUT_MS=${UPSTREAM_TIMEOUT_MS:-300000}
      - RESPONSES_ENABLED=${RESPONSES_ENABLED:-false}
      - RESPONSES_STATE_KEY=${RESPONSES_STATE_KEY:-}
      - RESPONSES_STATE_TTL_SECONDS=${RESPONSES_STATE_TTL_SECONDS:-604800}
      - RESPONSES_MAX_OUTPUT_TOKENS=${RESPONSES_MAX_OUTPUT_TOKENS:-8192}
      - RESPONSES_THINKING_BUDGET_TOKENS=${RESPONSES_THINKING_BUDGET_TOKENS:-1024}
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - app-data:/app/data
    expose:
      - "3456"
    restart: unless-stopped

  admin:
    build: ./admin
    environment:
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=https://${DOMAIN}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - INTERNAL_API_URL=http://app:3456
      - ADMIN_API_SECRET=${ADMIN_API_SECRET}
    expose:
      - "3000"
    depends_on:
      - app
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - app
      - admin
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    restart: unless-stopped

volumes:
  app-data:
  ollama-data:
  certbot-etc:
  certbot-www:
