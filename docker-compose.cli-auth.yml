# Optional overlay: docker compose -f docker-compose.yml -f docker-compose.cli-auth.yml up -d --build app
services:
  app:
    build:
      context: .
      target: cli-auth
    environment:
      - UPSTREAM_AUTH_SOURCE=claude_cli
      - CLAUDE_CONFIG_DIR=/home/node/.claude
      - CLAUDE_AUTH_EMAIL=${CLAUDE_AUTH_EMAIL:-}
      - CLAUDE_AUTH_AUTO_REFRESH=${CLAUDE_AUTH_AUTO_REFRESH:-false}
    volumes:
      - claude-auth:/home/node/.claude

volumes:
  claude-auth:
